name: Deploy Backend to Hugging Face

#pppp

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - backend/**
      - .github/workflows/deploy-huggingface.yml
  workflow_dispatch:

concurrency:
  group: huggingface-space-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Git LFS
        run: git lfs install

      - name: Clone Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone https://fahmee:${HF_TOKEN}@huggingface.co/spaces/fahmee/rekoisi-api hf-space

      - name: Sync backend files
        run: |
          rsync -av --delete \
            --exclude='.git' \
            --exclude='README.md' \
            --exclude='venv' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            ./Dockerfile ./.gitattributes ./backend hf-space/

          cat > hf-space/.gitignore <<'EOF'
          backend/venv/
          __pycache__/
          *.pyc
          .env
          EOF

      - name: Configure Hugging Face Git LFS
        working-directory: hf-space
        run: |
          git lfs install

      - name: Push to Hugging Face Space
        working-directory: hf-space
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No backend changes to deploy."
            exit 0
          fi
          git commit -m "Deploy backend from GitHub"
          git push
